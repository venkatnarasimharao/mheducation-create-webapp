<div class="cloadingontainer">
    <!-- Display loading message while data is being fetched -->
    @if (loading) {
      <div class="loading-message">
        Loading...
      </div>
    }
  
    <!-- Display no results found message if no results are returned -->
    @if (noResults && !loading) {
      <div class="no-results-message">
        Sorry, no results found.
      </div>
    }
  
    <!-- Display search results if available -->
    @if (!loading && !noResults) {
      @for (result of searchResults; track result) {
        <div class="card mb-3 shadow-sm">
          <div class="card-body">
            <div class="d-flex align-items-center">
              <p class="badge bg-primary me-2 mb-0">{{ result.type }}</p>
              <a href="#" class="text-decoration-none">{{ result.title }}</a>
            </div>
  
            <p class="card-text">
              <strong>By:</strong> {{ result.authors }}<br />
              <strong>&copy;{{ result.year }}</strong><br />
              <strong>Available Formats:</strong> {{ result.language }}
            </p>
  
            <!-- Change button text based on data availability -->
            <button class="btn btn-outline-primary btn-sm">
              {{ result.enableAddButton ? 'Add Entire Book +' : 'Remove Book -' }}
            </button>
          </div>
        </div>
      }
    }
  </div>
