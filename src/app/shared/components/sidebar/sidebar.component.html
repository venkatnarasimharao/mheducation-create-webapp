<div class="col-auto offcanvas-lg d-flex h-100 border-end">
  <ng-container *ngTemplateOutlet="navTemplate; context: { menuItems: menuItems }"></ng-container>
</div>


<ng-template #menuContent>
  <div class="offcanvas-end h-100 overflow-x-auto">
    <div class="offcanvas-header border-bottom  d-flex justify-content-between">
      <h4 class="offcanvas-title">{{"MainMenu" | translate}}</h4>
      <button type="button" class="bg-transparent border-0 fs-1" aria-label="Close" (click)="openMenu()"><i
          class="bi bi-x-lg text-dark "> </i></button>
    </div>
    <div class="offcanvas-body">
      <ng-container *ngTemplateOutlet="navTemplate; context: { menuItems: menuItems }"></ng-container>
    </div>
  </div>
</ng-template>



<ng-template #navTemplate let-menuItems="menuItems">
  <nav class="d-lg-block">
    <ul class="main-app-nav nav flex-column my-3 p-0">
      @for (menuItem of menuItems; track $index) {
      <li class="nav-item text-center">
        @if(!menuItem.type || menuItem.type != 'external') 
        {
        <a 
          [routerLink]="[menuItem.path]" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link d-flex align-items-center p-2">
          <i class="bi" [ngClass]="menuItem.icon"></i>
          <span>{{ menuItem.label | translate }}</span>
        </a>
      }

      @else(){
      <a
            [href]="menuItem.path"
            target="_blank"
            rel="noopener noreferrer"
            class="nav-link d-flex align-items-center p-2">
            <i class="bi" [ngClass]="menuItem.icon"></i>
            <span>{{ menuItem.label | translate }}</span>
          </a>
      }
      </li>
      }
    </ul>
  </nav>
</ng-template>
