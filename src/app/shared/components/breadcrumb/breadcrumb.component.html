<nav aria-label="breadcrumb">
  <ol class="breadcrumb d-flex gap-1">
    @for(item of list;track item.label){
      <li class="breadcrumb-item m-0 p-0">
        @if(!isLast(item)){
          <a href="#" [routerLink]="item.url" class="text-decoration-none">{{item.label | translate}}</a>
        } @else {
          <span aria-current="page">{{item.label | translate}}</span>
        }
      </li>
    }
  </ol>
</nav>
