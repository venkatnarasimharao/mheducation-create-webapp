<div ngbDropdown class="d-inline-block mb-1 mt-1">
  <button
    type="button"
    ngbDropdownToggle
    class="btn btn-outline-dark text-dark bg-transparent"
    aria-label="Sort by"
  >
    {{ selectedSortOption || 'Sort By' }}
  </button>
  <div ngbDropdownMenu aria-labelledby="dropdown-basic">
    <button
      *ngFor="let option of sortOptions"
      ngbDropdownItem
      (click)="onSortChange(option)"
      class="dropdown-item"
    >
      {{ option.label }}
    </button>
  </div>
</div>
