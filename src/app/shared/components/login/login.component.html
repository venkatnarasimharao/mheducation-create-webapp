<div class="modal-header d-flex justify-content-between">
    <h4 class="modal-title">Login</h4>
    <button type="button" class="bg-transparent border-0 fs-1" aria-label="Close" (click)="activeModal.dismiss()">
        <i class="bi bi-x-lg text-white"></i>
    </button>
</div>
<div class="modal-body">
    <form name="form" #f="ngForm" (ngSubmit)="f.form.valid && onSubmit(f)" novalidate>
        <div class="form-group mb-3">
            <label for="form.username" class="form-label">Username</label>
            <input type="text" class="form-control fs-3" autocomplete="off" name="username" [(ngModel)]="form.username"
                required #username="ngModel" [ngClass]="{ 'is-invalid': f.submitted && username.errors }" />
            <div *ngIf="f.submitted && username.errors" class="invalid-feedback">
                @if(username.errors['required']){
                <div>Username is required</div>
                }
            </div>
        </div>
        <div class="form-group mb-3">
            <label for="form.password" class="form-label">Password</label>
            <div class="d-flex form-control align-items-center justify-content-between"
                [ngClass]="{ 'is-invalid': f.submitted && password.errors }">
                <input type="{{passwordFieldType}}" class=" no-focus-outline border-0 fs-3 w-100" name="password"
                    [(ngModel)]="form.password" required #password="ngModel" />
                <button type="button" class="bg-transparent border-0" (click)="togglePasswordVisibility()"
                    aria-label="Toggle password visibility">
                    <i class="bi" [ngClass]="passwordFieldType === 'password' ? 'bi-eye' : 'bi-eye-slash'"></i>
                </button>
            </div>
            <div *ngIf="f.submitted && password.errors" class="invalid-feedback">
                @if(password.errors['required']){
                <div>Password is required</div>
                }

            </div>
        </div>
        @if(loginError) {
        <div class="text-danger d-flex align-items-center">
            <div class="align-items-center">*{{loginError}}</div>
        </div>
        }
        <div class="d-flex justify-content-between">
            <div class="d-flex align-items-center">
                <button type="submit" class="btn btn-primary d-flex align-items-center justify-content-center"
                    [disabled]="loaderActive">
                    <span>LogIn</span>
                    @if(loaderActive){
                    <div class="hec-loader-btn"></div>
                    }
                </button>

                <a href="https://accounts-qalv.mheducation.com/registration/create?app=createqa.mheducation.com&redirectUrl=https:%2F%2Fcreateqa.mheducation.com%2Fcreateonline"
                    target="_blank" class="m-2">Sign Up</a>
            </div>
            <button type="button" class="btn btn-secondary" (click)="onForgotPassword()">Forgot Password?</button>
        </div>
    </form>
</div>
