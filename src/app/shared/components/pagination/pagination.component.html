<ngb-pagination
  [collectionSize]="totalPages * 10"
  [(page)]="currentPage"
  [maxSize]="maxSize"
  aria-label="Page navigation"
  (pageChange)="onPageChange($event)"
>
  <ng-template ngbPaginationPrevious aria-label="Previous">Previous</ng-template>
  <ng-template ngbPaginationNumber let-p>{{ p }}</ng-template>
  <ng-template ngbPaginationNext aria-label="Next">Next</ng-template>
</ngb-pagination>
