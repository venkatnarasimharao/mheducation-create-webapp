<ngb-pagination
  [collectionSize]="totalPages * pageSize"
  [(page)]="currentPage"
  [maxSize]="maxSize"
  [pageSize]="pageSize"
  aria-label="Page navigation"
  (pageChange)="onPageChange($event)"
>
  <ng-template ngbPaginationPrevious aria-label="Previous">{{ 'Previous' | translate }}</ng-template>
  <ng-template ngbPaginationNumber let-p>{{ p }}</ng-template>
  <ng-template ngbPaginationNext aria-label="Next">{{ 'Next' | translate }}</ng-template>
</ngb-pagination>
