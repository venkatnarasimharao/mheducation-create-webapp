<div class="home-page d-flex flex-column flex-md-row">
    <div class="image-gallery-container flex-grow-1">
      
      <!-- Header Section -->
      <div class="row align-items-center mb-2">
        <div class="col d-flex justify-content-between align-items-center">
          <h4 class="m-0">{{ 'BrowseCollections' | translate }}</h4>
          <button class="btn btn-light ms-3 mt-2" [routerLink]="['/special-collection']">
            {{ 'ShowAllCollections' | translate }}
          </button>
        </div>
      </div>
      
      <!-- Collections List -->
      <ul class="row list-unstyled">
        <li class="col-lg-3 col-md-6 col-sm-6 mb-4" *ngFor="let collection of collectionsData">
          <hec-image-card 
            [image]="collection.image" 
            [name]="collection.name">
          </hec-image-card>
        </li>
      </ul>
  
    </div>
  </div>
