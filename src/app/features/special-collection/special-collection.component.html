<div class="container-fluid d-flex flex-column gallery-container">
  
    <!-- Header Row -->
    <div class="row align-items-center mb-2">
      <div class="col d-flex justify-content-between align-items-center">
        <h4 class="m-0">Special Collection</h4>
        <button class="btn btn-light ms-3 mt-2" [routerLink]="['/home']">
          Exit All Collections
        </button>
      </div>
    </div>
  
    <!-- Grouped Collections -->
    <div *ngFor="let group of groupedCollections">
      
      <!-- Category Header -->
      <h5 class="mt-4 light-secondary p-2 rounded bg-light">{{ group.category }}</h5>
  
      <!-- Collections Row -->
      <ul class="row list-unstyled">
        <li *ngFor="let collection of group.collections" class="col-lg-3 col-md-6 col-sm-6 mb-4">
          <hec-image-card [image]="collection.image" [name]="collection.name"></hec-image-card>
        </li>
      </ul>
      
    </div>
    
  </div>
