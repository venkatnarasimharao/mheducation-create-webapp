<div class="container-fluid">
  <div class="row">
    <div class="col-12 border-0 border-bottom pb-3 my-2">

      <div  class="d-flex flex-column flex-md-row justify-content-between align-items-center mt-2"
       >
        <div class="d-flex flex-column align-items-start">
          <span class="fw-bold mb-1">{{ selectProjectHeading | translate}}</span>
          <div ngbDropdown class="d-inline-block" aria-labelledby="select-project-heading">
            <button type="button" ngbDropdownToggle noCaret class="btn btn-outline-dark text-dark bg-transparent w-100"  aria-label="Select a project">
              {{ selectProjectTitle | translate}}
              <i class="bi bi-chevron-down ms-7"></i>
            </button>
            <div ngbDropdownMenu class="w-100" aria-labelledby="select-project-heading">
              @for(item of selectProjectItems; track item.name){
                <button
                type="button"
                class="dropdown-item"
                (click)="onSelect(item)"
                
              >
                {{ item.name | translate}}
              </button>
              }
           
            </div>
          </div>
        </div>
    
        <div class="d-flex gap-1 mt-2 mt-md-0 flex-wrap justify-content-center">
          <div class="d-flex flex-column align-items-start me-3">
            <span class="fw-bold mb-1">{{ selectFormatHeading | translate}}</span>
            <div ngbDropdown class="d-inline-block" aria-labelledby="select-format-heading">
              <button type="button" ngbDropdownToggle noCaret class="btn btn-outline-dark text-dark bg-transparent w-100" aria-label="Select a format">
                {{ selectFormatTitle | translate}}
                <i class="bi bi-chevron-down ms-7"></i>
              </button>
              <div ngbDropdownMenu class="w-100" aria-labelledby="select-format-heading">
                @for(item of selectFormatItems; track item.name){
                  <button
                  type="button"
                  class="dropdown-item"
                  (click)="onSelected(item)"
                >
                  {{ item.name | translate}}
                </button>
                }
              </div>
            </div>
          </div>
    
          <!-- Arrange Button -->
          <div class="d-flex flex-column align-items-start">
            <span class="fw-bold mb-1">{{ selectArrangeTitle | translate}}</span>
            <button type="button" class="btn fw-bold custom-dark-blue" [routerLink]="['/arrange']" aria-label="Arrange items">
              {{'Arrange' | translate}}
              <i class="bi bi-chevron-right ms-5"></i>
            </button>
          </div>
        </div>
      </div>
     
     
    </div>

    <!-- Breadcrumb Section -->
    <div class="col-12">
      <hec-breadcrumb></hec-breadcrumb>
    </div>


    <!-- filter accordion  -->
     <div>
       <div class="col-4 mt-5">
        <hec-filter-accordion [collectionfilterData]="collectionfilter"></hec-filter-accordion>
     </div>
     
    <!-- Pagination Section -->
      <div class="d-flex flex-column vh-100">
      <div class="mt-auto ms-auto mb-3 me-3">
          <hec-pagination
            [currentPage]="currentPageNumber"
            [totalPages]="totalPagesCount"
            [maxSize]="pagePerItem"
            (pageChange)="onPageChange($event)">
          </hec-pagination>
        </div>
      </div>
     </div>
     

   
    
  </div>
</div>
