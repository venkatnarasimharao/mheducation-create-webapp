<div class="card-detail">
  <h2>{{ 'CardDetails' | translate }}</h2>

  @if(image){
    <div>
      <img [src]="image" alt="{{ 'CardImageAlt' | translate }}" class="w-25" />
      <p>{{ 'CardDetailsDescription' | translate }}</p>
    </div>
  }

  

  <ng-template #noImage>
    <p>{{ 'NoImageAvailable' | translate }}</p>
  </ng-template>
</div>
