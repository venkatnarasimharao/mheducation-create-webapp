<div>  
  <div class="card-body">
    @if(image){
      <div class="title">
        <h5>Results for {{ title }} Collection</h5>
      </div>
      <div class="mb-3">
        <img [src]="image" alt="{{ 'CardImageAlt' | translate }}" class="img-fluid rounded">
      </div>
     
    }
  
    @else{
      <div>
        {{ 'NoImageAvailable' | translate }}
      </div>
    }
  </div>
